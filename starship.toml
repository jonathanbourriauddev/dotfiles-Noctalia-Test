"$schema" = "https://starship.rs/config-schema.json"

# ============================================================
# STARSHIP — V1 Noctalia
# Prompt inspiré de l'ancienne configuration
# La palette est générée dynamiquement par Noctalia
# ============================================================

palette = "noctalia"

format = """
[](yellow)\
$username\
[](fg:yellow bg:green)\
$directory\
[](fg:green bg:surface2)\
$git_branch\
$git_status\
[](fg:surface2 bg:surface1)\
$time\
[](fg:surface1)\
$line_break\
$character
"""

# ------------------------------------------------------------
# USER
# ------------------------------------------------------------

[username]
show_always = true
style_user = "fg:crust bg:yellow bold"
style_root = "fg:text bg:red bold"
format = "[ 󰣇 $user ]($style)"

# ------------------------------------------------------------
# DIRECTORY
# ------------------------------------------------------------

[directory]
style = "fg:crust bg:green bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ------------------------------------------------------------
# GIT
# ------------------------------------------------------------

[git_branch]
symbol = " "
style = "fg:text bg:surface2"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:text bg:surface2"
format = "[$all_status$ahead_behind ]($style)"

# ------------------------------------------------------------
# TIME
# ------------------------------------------------------------

[time]
disabled = false
time_format = "%R"
style = "fg:text bg:surface1"
format = "[  $time ]($style)"

# ------------------------------------------------------------
# PROMPT — SECOND LINE
# ------------------------------------------------------------

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"


